function tripCacheKey(){return 'travel-offline-v1:'+ (new URLSearchParams(location.search).get('trip')||'local');}
function readTripCache(){try{return JSON.parse(localStorage.getItem(tripCacheKey())||'null');}catch{return null;}}
function pendingTrip(){return readTripCache()?.pending===true;}
function cacheTrip(trip,pending){
  try{localStorage.setItem(tripCacheKey(),JSON.stringify({trip,pending,revision:uid(),savedAt:new Date().toISOString()}));return true;}
  catch(e){console.warn('[offline-cache]',e);return false;}
}
function mergeTrash(a={},b={}){
  const result={...b};
  for(const [k,v] of Object.entries(a||{}))if(!(k in result)||Math.abs(v)>Math.abs(result[k]))result[k]=v;
  return result;
}
function mergedTrip(local,remote){
  const trash=mergeTrash(local.trash,remote.trash);
  const out={...remote,...local,trash};
  out.days=mergeDays(local.days,remote.days,trash);
  for(const k of ['expenses','memo','wishlist','wlCats'])out[k]=mergeById(local[k],remote[k],trash);
  out.travelers=[...new Set([...(remote.travelers||[]),...(local.travelers||[])])].filter(n=>!(trash['tv:'+n]>0));
  out.travelerIcons={...remote.travelerIcons,...local.travelerIcons};
  out.travelerMeta={...remote.travelerMeta};
  for(const [name,m] of Object.entries(local.travelerMeta||{}))if(!out.travelerMeta[name]||(m._u||0)>=(out.travelerMeta[name]._u||0))out.travelerMeta[name]=m;
  return out;
}
let syncBusy=false;
async function retryTripSync(){
  if(!new URLSearchParams(location.search).get('trip'))return;
  if(syncBusy||cloud.blocked||!pendingTrip())return;
  if(!navigator.onLine){cloud.status='離線・已存手機，連線後重試';render();return;}
  if(!cloud.doc){await initCloud();if(!cloud.doc)return;}
  syncBusy=true;cloud.status='已存手機・同步中';render();
  const journal=readTripCache();
  try{
    const result=await cloud.doc.firestore.runTransaction(async tx=>{
      const snap=await tx.get(cloud.doc);
      const next=mergedTrip(journal.trip,snap.exists?snap.data():{});
      tx.set(cloud.doc,next,{merge:true});return next;
    });
    if(readTripCache()?.revision===journal.revision){
      S={...S,...result};normalizeTravelerIds();cacheTrip(buildTrip(),false);cloud.lastApplied=result;
      cloud.status='已同步雲端・手機可離線查看';
    }else cloud.status='已存手機・尚有更新待同步';
  }catch(e){cloud.blocked=e.code==='permission-denied';cloud.status=cloud.blocked?'雲端拒絕寫入・請確認權限後重新載入；手機副本已保留':'同步失敗・手機副本已保留';console.warn('[sync]',e);}
  finally{syncBusy=false;render();}
}
window.addEventListener('online',()=>retryTripSync());
window.addEventListener('offline',()=>{cloud.status='離線・使用手機副本';render();});
setInterval(()=>{if(navigator.onLine&&pendingTrip())retryTripSync();},30000);
function tripClock(now=new Date()){
  const japan=(new URLSearchParams(location.search).get('trip')==='tokyo2026')||S.days.some(d=>/東京|河口湖|日本|大阪|京都/.test(d.city||''));
  const zone=japan?'Asia/Tokyo':Intl.DateTimeFormat().resolvedOptions().timeZone;
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`,minutes:Number(p.hour)*60+Number(p.minute),label:japan?'日本時間 UTC+9':'裝置當地時間'};
}
function travelerId(name){return S.travelerMeta?.[name]?.id||('legacy-'+encodeURIComponent(name));}
function bindExpenseIds(e){
  e.paidById=e.paidBy?travelerId(e.paidBy):'';
  e.splitWithIds=(e.splitWith||[]).map(travelerId);
  e.sharesById=e.shares?Object.fromEntries(Object.entries(e.shares).map(([n,v])=>[travelerId(n),v])):null;
}
function normalizeTravelerIds(){
  S.travelerMeta={...(S.travelerMeta||{})};
  for(const n of S.travelers||[])S.travelerMeta[n]={...S.travelerMeta[n],id:travelerId(n),name:S.travelerMeta[n]?.name||n};
  const byId={};
  for(const [n,m] of Object.entries(S.travelerMeta))if(m.id&&(!byId[m.id]||(m._u||0)>(byId[m.id]._u||0)))byId[m.id]={...m,name:m.name||n};
  S.travelers=[...new Set((S.travelers||[]).map(n=>byId[travelerId(n)]?.name||n))].filter(n=>!((S.trash||{})['tv:'+n]>0));
  S.expenses=(S.expenses||[]).map(e=>{
    const x={...e};if(!('paidById' in x))bindExpenseIds(x);
    if(x.paidById&&byId[x.paidById])x.paidBy=byId[x.paidById].name;
    if(x.splitWithIds)x.splitWith=x.splitWithIds.map((id,i)=>byId[id]?.name||x.splitWith?.[i]).filter(Boolean);
    if(x.sharesById)x.shares=Object.fromEntries(Object.entries(x.sharesById).map(([id,v])=>[byId[id]?.name||Object.keys(x.shares||{}).find(n=>travelerId(n)===id)||id,v]));
    return x;
  });
}

loadFx();

  });
