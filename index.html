<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5e5e">
<script>(function(){try{var t=localStorage.getItem('trip-theme')||'auto';var d=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();</script>
<title>互動旅遊行程規劃器</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif;
  color-scheme:light;
  /* 表面 */
  --bg:#edf4f0;--bg-2:#fff7eb;--paper:#fff;--soft:#f3f7f5;
  --app-veil:rgba(255,255,255,.7);--app-ring:rgba(255,255,255,.55);
  --nav-bg:rgba(255,255,255,.92);--menu-bg:rgba(255,255,255,.94);--menu-ring:rgba(255,255,255,.7);
  --scrim:rgba(10,18,17,.5);
  /* 文字與線條 */
  --ink:#18211f;--muted:#66736f;--line:#d9e2df;--line-2:#b9c7c2;--line-a:rgba(217,226,223,.8);
  --ink-fill:#1b2926;
  /* 品牌與強調 */
  --teal:#0f5e5e;--teal-fill:#0f5e5e;--teal-fill-2:#183b40;--teal-soft:#42a787;--teal-edge:#8ad5b6;
  --mint:#dff5eb;--sun:#f2a93b;--rose:#d85d7b;--blue:#3977d4;--danger:#c00020;
  --ai:#5b3fc4;--ai-2:#3d1fa8;
  /* 狀態/分類色票（背景/文字成對） */
  --t-green-bg:#e4f4ed;--t-green-fg:#085041;
  --t-blue-bg:#e6f1fb;--t-blue-fg:#0c447c;--t-blue-line:#cfe3f5;
  --t-amber-bg:#faeeda;--t-amber-fg:#6d4a08;
  --t-purple-bg:#eeedfe;--t-purple-fg:#3c3489;--t-purple-line:#c8b8f0;
  --t-rose-bg:#fbeaf0;--t-rose-fg:#8e2445;
  --t-gray-bg:#f1efe8;--t-gray-fg:#4b4b45;
  /* 旅伴八色 */
  --tv1-bg:#fde2e4;--tv1-fg:#a83245;--tv1-ac:#d85d7b;
  --tv2-bg:#e0f2fe;--tv2-fg:#0a4d7a;--tv2-ac:#3977d4;
  --tv3-bg:#fef3c7;--tv3-fg:#7a4f00;--tv3-ac:#e6ac30;
  --tv4-bg:#dcfce7;--tv4-fg:#0a5e3a;--tv4-ac:#1d9e75;
  --tv5-bg:#ede9fe;--tv5-fg:#4c1d95;--tv5-ac:#7c3aed;
  --tv6-bg:#fee4e6;--tv6-fg:#9c0a36;--tv6-ac:#e11d48;
  --tv7-bg:#cffafe;--tv7-fg:#0a5560;--tv7-ac:#0891b2;
  --tv8-bg:#ffe5cc;--tv8-fg:#7a3f00;--tv8-ac:#ea7c1f;
  --shadow:0 14px 38px rgba(20,45,40,.12);--r:14px;
}
/* ── 夜航深色主題：深墨綠海面，品牌 teal 轉為亮薄荷 ── */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1514;--bg-2:#101b18;--paper:#17231f;--soft:#1c2a26;
  --app-veil:rgba(19,29,26,.62);--app-ring:rgba(255,255,255,.05);
  --nav-bg:rgba(16,26,23,.9);--menu-bg:rgba(24,36,32,.96);--menu-ring:rgba(255,255,255,.08);
  --scrim:rgba(0,0,0,.62);
  --ink:#e6efec;--muted:#8fa39d;--line:#28372f;--line-2:#3a4c46;--line-a:rgba(46,62,56,.85);
  --ink-fill:#2b3c37;
  --teal:#4cc4b2;--teal-fill:#136a62;--teal-fill-2:#188276;--teal-soft:#54c9a4;--teal-edge:#2f6f58;
  --mint:#143430;--sun:#f2b558;--rose:#ef7f9a;--blue:#6aa5e8;--danger:#ff7a90;
  --ai:#7a5df0;--ai-2:#9d87f7;
  --t-green-bg:#14312a;--t-green-fg:#8fdcb8;
  --t-blue-bg:#14293c;--t-blue-fg:#96c8f0;--t-blue-line:#26496b;
  --t-amber-bg:#332811;--t-amber-fg:#ecd08e;
  --t-purple-bg:#262041;--t-purple-fg:#c2b3f2;--t-purple-line:#4b3d85;
  --t-rose-bg:#391f2a;--t-rose-fg:#f2a4bb;
  --t-gray-bg:#28302c;--t-gray-fg:#b9c2ba;
  --tv1-bg:#3a2126;--tv1-fg:#f3a8b4;--tv1-ac:#e5738d;
  --tv2-bg:#16283a;--tv2-fg:#93c9f2;--tv2-ac:#5c9be0;
  --tv3-bg:#33290f;--tv3-fg:#ecd28a;--tv3-ac:#e6ac30;
  --tv4-bg:#14301f;--tv4-fg:#8fdcb2;--tv4-ac:#2fbe8b;
  --tv5-bg:#261e3d;--tv5-fg:#c4b1f5;--tv5-ac:#9a70f5;
  --tv6-bg:#3a1a22;--tv6-fg:#f59db1;--tv6-ac:#ef5f7d;
  --tv7-bg:#10303a;--tv7-fg:#8adbe8;--tv7-ac:#35b3cc;
  --tv8-bg:#33220f;--tv8-fg:#f0bd8a;--tv8-ac:#ef9440;
  --shadow:0 16px 40px rgba(0,0,0,.5);
}
/* 深色下：地圖圖磚壓暗、彈窗跟隨主題、捲軸配色 */
:root[data-theme="dark"] .leaflet-tile{filter:brightness(.72) contrast(1.06) saturate(.85)}
:root[data-theme="dark"] .leaflet-popup-content-wrapper,:root[data-theme="dark"] .leaflet-popup-tip{background:var(--paper);color:var(--ink)}
:root[data-theme="dark"] .leaflet-bar a{background:var(--paper);color:var(--ink);border-color:var(--line)}
:root[data-theme="dark"]{scrollbar-color:var(--line-2) transparent}
:root[data-theme="dark"] img.cover-img{filter:brightness(.9)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{min-height:100vh;font-size:15px;line-height:1.45;background:linear-gradient(180deg,var(--bg) 0,var(--bg-2) 100%);color:var(--ink);overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
a{text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#root{min-height:100vh}
.app{min-height:100vh;max-width:980px;margin:0 auto;background:var(--app-veil);box-shadow:0 0 0 1px var(--app-ring)}
.cover{position:relative;z-index:30;aspect-ratio:16/9;min-height:200px;max-height:360px;color:#fff;background:var(--teal-fill);background-image:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,.05) 38%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.72) 100%),var(--cover);background-size:cover;background-position:center var(--cover-pos,30%);display:flex;flex-direction:column;justify-content:space-between}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 16px 0}
.cover-bottom{padding:0 16px 18px;display:flex;flex-direction:column;gap:6px}
.hdr-title{font-size:26px;line-height:1.15;font-weight:900;letter-spacing:-.5px;cursor:pointer;text-shadow:0 2px 16px rgba(0,0,0,.5);word-break:break-word}
.hdr-title-edit-icon{font-size:14px;opacity:.65;margin-left:4px;vertical-align:middle}
.hdr-sub{font-size:12px;color:rgba(255,255,255,.82);text-shadow:0 1px 8px rgba(0,0,0,.4);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hdr-sub-chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;backdrop-filter:blur(6px)}
.hdr-sync-switch{width:24px;height:24px;border-radius:999px;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;line-height:1;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.12);transition:transform .14s,background .14s,border-color .14s}
.hdr-sync-switch:hover,.hdr-sync-switch:active{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.5);transform:translateY(-1px)}
.hdr-sync-switch:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:2px}
.stats-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.stat-cell{padding:13px 14px;display:flex;flex-direction:column;gap:3px;position:relative}
.stat-cell+.stat-cell::before{content:'';position:absolute;left:0;top:18%;height:64%;width:1px;background:var(--line)}
.stat-n{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.5px;line-height:1}
.stat-l{font-size:11px;color:var(--muted);font-weight:700}
.trip-brief{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:3px}
.trip-brief-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.25);font-size:11px;font-weight:800;color:#fff;backdrop-filter:blur(8px);text-shadow:0 1px 6px rgba(0,0,0,.35)}
.cover-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.glass{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(10px)}
.cover-menu-wrap{position:relative;z-index:80;flex-shrink:0}
.cover-menu-backdrop{position:fixed;inset:0;z-index:110;background:transparent}
.hamb{width:46px;height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.16);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.16)}
.hamb span{width:20px;height:2px;border-radius:99px;background:var(--paper);box-shadow:0 1px 5px rgba(0,0,0,.2)}
.cover-menu{position:absolute;right:0;top:54px;z-index:120;min-width:190px;padding:8px;border-radius:18px;background:var(--menu-bg);backdrop-filter:blur(18px);border:1px solid var(--menu-ring);box-shadow:0 18px 44px rgba(18,38,35,.24)}
.cover-menu button{width:100%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:10px;padding:12px 11px;border-radius:12px;font-weight:900;cursor:pointer;text-align:left}
.cover-menu button:active,.cover-menu button:hover{background:#eef7f3}
.cover-menu .mi{width:24px;height:24px;border-radius:8px;background:#e4f3ed;display:flex;align-items:center;justify-content:center;color:var(--teal)}
.title-edit{display:flex;gap:8px;align-items:center;width:100%;margin-top:auto}
.tni{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:11px 12px;font-size:18px;font-family:var(--font-sans);flex:1;min-width:0}
.tni::placeholder{color:rgba(255,255,255,.62)}
.quick{display:none}
.nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:8px;background:var(--nav-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-a);overflow-x:auto}
.nav-btn{min-width:62px;white-space:nowrap}
.buy-hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,var(--teal-fill),#356e65);color:#fff;margin-bottom:18px}
.buy-hero h2{margin:0 0 8px;font-size:23px}
.buy-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.buy-card{display:flex;align-items:flex-start;gap:12px;padding:16px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.buy-check{width:24px;height:24px;flex-shrink:0;accent-color:var(--teal);margin-top:3px;cursor:pointer}
.buy-main{flex:1;min-width:0;overflow-wrap:anywhere}
.buy-name{font-size:16px;font-weight:800}.buy-card.done .buy-name{text-decoration:line-through;color:var(--muted)}
.buy-meta{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap}
.buy-actions{display:flex;gap:4px;flex-shrink:0}
.buy-area-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 10px;padding:10px 14px;border-left:4px solid var(--teal);border-radius:0 12px 12px 0;background:var(--soft);font-size:16px}
.buy-area-title small{font-size:12px;color:var(--muted);font-weight:600}
.buy-category{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--teal);font-size:11px;margin-top:6px}
.buy-photo{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.buy-photo summary{padding:10px 12px;font-size:13px;color:var(--teal);font-weight:700;cursor:pointer}
.buy-photo img,.buy-preview img{display:block;width:100%;max-height:260px;object-fit:contain;background:var(--soft);border-radius:10px}
.buy-photo img{padding:8px}.buy-preview{margin-top:10px}
.buy-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buy-fields>*{min-width:0}
.buy-tools select{width:auto;max-width:100%;min-height:40px}
@media(max-width:420px){.buy-fields{grid-template-columns:1fr}}
@media(max-width:420px){.nav-btn{font-size:12px;gap:3px;min-width:55px}.buy-card{padding:12px;gap:8px}.buy-actions{flex-direction:column}}
.nav-btn{flex:1;min-height:42px;padding:8px 4px;font-size:13.5px;color:var(--muted);border:0;background:transparent;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700}
.nav-btn.on{color:#fff;background:var(--teal-fill);font-weight:700;box-shadow:0 7px 18px rgba(15,94,94,.22)}
.body{padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.day-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:12px;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.dtab{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--muted);box-shadow:0 4px 14px rgba(29,58,50,.05)}
.dtab.on{background:var(--teal-fill-2);color:#fff;border-color:var(--teal-fill-2)}
.dtab-add{border-style:dashed;background:var(--t-amber-bg);color:var(--t-amber-fg)}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.section-title-wrap{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;}
.section-title{font-weight:800;font-size:17px;line-height:1.25;min-width:0;word-break:keep-all;color:var(--ink);}
.section-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.section-meta-date{font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:3px;}
.day-summary{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 11px}
.day-summary-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--muted)}
.travel-toolkit{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.6}
.travel-toolkit summary{cursor:pointer;font-weight:800;padding:8px 0}
.travel-toolkit .sync-row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.travel-important{margin:14px -2px 4px}
.travel-important>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 2px!important;font-size:17px;letter-spacing:.02em}
.travel-important>summary::-webkit-details-marker{display:none}
.important-heading-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--teal-fill);color:white}
.important-count{font-size:12px;font-weight:700;color:var(--muted);margin-left:auto}
.important-chevron{transition:transform .2s}.travel-important[open] .important-chevron{transform:rotate(180deg)}
.important-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:2px 0 12px}
.travel-key{--key-color:var(--t-blue-fg);--key-tint:var(--t-blue-bg);border:1px solid var(--line);border-top:3px solid var(--key-color);border-radius:16px;background:var(--paper);box-shadow:0 5px 18px rgba(0,0,0,.04);overflow:hidden;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.travel-key[data-kind="stay"]{--key-color:var(--t-green-fg);--key-tint:var(--t-green-bg)}
.travel-key[data-kind="ride"]{--key-color:var(--t-amber-fg);--key-tint:var(--t-amber-bg)}
.travel-key[data-kind="booking"]{--key-color:var(--t-purple-fg);--key-tint:var(--t-purple-bg)}
.key-ticket-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--key-tint)}
.key-kind{display:flex;align-items:center;gap:7px;color:var(--key-color);font-size:14px;font-weight:800}
.key-time{font-size:25px;line-height:1;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--key-color);white-space:nowrap}
.key-content{padding:16px;flex:1}.key-content h3{font-size:16px;line-height:1.5;margin:0 0 8px;color:var(--ink)}
.key-status{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:800;background:var(--t-amber-bg);color:var(--t-amber-fg);margin-bottom:9px}
.key-status.booked{background:var(--t-green-bg);color:var(--t-green-fg)}
.key-address{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 10px}
.key-note{font-size:14px;line-height:1.8;color:var(--ink);white-space:pre-wrap;margin:0}
.key-more summary{font-size:13px!important;color:var(--key-color);font-weight:700;padding:6px 0!important}
.key-actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px dashed var(--line);background:var(--soft)}
.key-actions a,.key-actions button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:9px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--key-color);cursor:pointer}
.key-actions a:focus-visible,.travel-important summary:focus-visible{outline:2px solid var(--key-color,var(--teal-fill));outline-offset:3px}
@media(max-width:640px){.important-grid{grid-template-columns:1fr}.key-time{font-size:28px}.key-content{padding:14px 16px}.travel-toolkit{padding:12px}.key-actions a{min-height:44px;flex:1}}
.travel-segment{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--t-blue-fg);overflow-wrap:anywhere}
.section-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:nowrap;position:relative;flex-shrink:0}
.action-group{display:flex;align-items:center;gap:7px;position:relative;flex-wrap:nowrap}
.quick-holder{position:relative}
.itin-map-card{background:linear-gradient(180deg,#f7fbff 0%,#fff 100%);border:1px solid var(--t-blue-line);border-radius:var(--r);margin:0 0 12px;overflow:hidden;box-shadow:0 8px 24px rgba(31,59,53,.06)}
.itin-map-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--t-blue-line)}
.itin-map-title{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--t-blue-fg);min-width:0}
.itin-map-title span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itin-map-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.itin-map-toggle{width:32px;height:32px;border-radius:999px;border:1px solid var(--t-blue-line);background:var(--paper);color:var(--t-blue-fg);font-weight:900;cursor:pointer}
.itin-map-body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,.9fr);gap:0}
.itin-map-canvas{width:100%;min-height:270px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:800;position:relative;z-index:1}
.itin-map-canvas .leaflet-container{font-family:var(--font-sans)}
.itin-map-loading{padding:14px;text-align:center;color:var(--muted)}
.itin-map-marker{width:28px;height:28px;border-radius:999px;background:var(--teal-fill);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;border:2px solid #fff;box-shadow:0 4px 12px rgba(31,59,53,.25)}
.itin-map-marker.combo{width:auto;min-width:34px;padding:0 8px;border-radius:999px;font-size:11px;letter-spacing:0}

  .loc-wrap{padding:12px 13px}
  .loc-body{min-width:0}
  .tl-item{grid-template-columns:44px 20px minmax(0,1fr)}

  .split-txn{grid-template-columns:1fr;gap:6px;text-align:center}
  .split-txn-person{justify-content:center}

  .body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
  .exp-row{align-items:flex-start;padding:14px 12px}

/* ── Explore tab ───────────────────────────── */
.exp-ctx-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--t-green-bg);border-radius:12px;border:1px solid var(--teal-edge);margin-bottom:12px;flex-wrap:wrap;}
.exp-ctx-city{font-size:13px;font-weight:800;color:var(--t-green-fg);}
.exp-ctx-day{font-size:12px;color:var(--muted);}
.exp-cat-row{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;flex-wrap:wrap;}
.exp-cat-row::-webkit-scrollbar{display:none;}
.exp-cat-btn{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.exp-cat-btn.on{background:var(--teal-fill);color:#fff;border-color:var(--teal);}
.exp-search-row{display:flex;gap:8px;margin-bottom:14px;}
.exp-search-row input{flex:1;}
.exp-search-row button{flex-shrink:0;padding:0 18px;}
.exp-results{display:flex;flex-direction:column;gap:9px;}
.exp-card{background:var(--paper);border-radius:14px;border:1px solid var(--line);overflow:hidden;box-shadow:0 4px 14px rgba(31,59,53,.06);display:flex;align-items:stretch;}

.exp-card-body{flex:1;padding:12px 14px;min-width:0;}
.exp-card-name{font-weight:900;font-size:15px;margin-bottom:3px;word-break:break-word;}
.exp-card-addr{font-size:12px;color:var(--muted);margin-bottom:6px;word-break:break-word;}
.exp-card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.exp-card-tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;}
.exp-card-actions{display:flex;gap:7px;flex-wrap:wrap;}
.exp-empty{text-align:center;padding:32px 12px;color:var(--muted);font-size:14px;}
.exp-loading{text-align:center;padding:24px 12px;color:var(--muted);font-size:14px;}
.exp-add-toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--teal-fill);color:#fff;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:800;z-index:200;box-shadow:0 8px 24px rgba(15,94,94,.35);pointer-events:none;animation:toast-in .25s ease;}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── Wishlist tab ───────────────────────────── */
.wl-topbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.wl-filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.wl-filter-row::-webkit-scrollbar{display:none;}
.wl-filter-btn{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--muted);white-space:nowrap;flex-shrink:0;}

.wl-action-row{display:flex;gap:8px;}
.wl-add-btn{flex:1;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:800;background:var(--teal-fill);color:#fff;border:none;cursor:pointer;white-space:nowrap;text-align:center;}
.wl-ai-btn{flex:1;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:800;background:var(--ai);color:#fff;border:none;cursor:pointer;white-space:nowrap;text-align:center;}
.wl-group{margin-bottom:18px;}

.wl-card{background:var(--paper);border-radius:14px;border:1.5px solid var(--line);padding:13px 14px;margin-bottom:8px;position:relative;box-shadow:0 4px 14px rgba(31,59,53,.05);}
.wl-card-name{font-weight:900;font-size:15px;margin-bottom:3px;padding-right:28px;line-height:1.3;}

.wl-card-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.wl-day-btn{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--teal);font-weight:800;cursor:pointer;white-space:nowrap;}

.wl-edit-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--t-gray-bg);color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.wl-edit-btn:hover{background:var(--t-green-bg);}
.wl-del-btn{width:26px;height:26px;border-radius:50%;border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:color .15s;}
.wl-del-btn:hover{color:var(--danger);}
.wl-del-btn:hover{background:var(--t-rose-bg);color:var(--danger);}
.wl-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:800;margin-bottom:7px;}
.wl-empty{text-align:center;padding:40px 12px;color:var(--muted);}
.wl-toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--teal-fill);color:#fff;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:800;z-index:200;box-shadow:0 8px 24px rgba(15,94,94,.35);pointer-events:none;animation:wl-toast-in .25s ease;white-space:nowrap;}

.exp-ctx-bar{display:none;}
/* ── Sync quick entry ─── */
.sync-quick{display:flex;align-items:center;gap:7px;margin-top:10px;padding:8px 12px;background:rgba(255,255,255,.14);border-radius:12px;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);}

.sync-quick-btn{flex-shrink:0;background:rgba(255,255,255,.22);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:800;padding:5px 12px;cursor:pointer;white-space:nowrap;}

/* ════ HERO modal (App Store expand) ════ */
.hero-backdrop{position:fixed;inset:0;z-index:80;pointer-events:none;
  background:rgba(0,0,0,0);
  -webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);
  transition:background .36s ease,-webkit-backdrop-filter .36s ease,backdrop-filter .36s ease;}
.hero-backdrop.open{background:rgba(0,0,0,.28);pointer-events:auto;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.hero-card{position:fixed;z-index:81;background:var(--paper);overflow:hidden;touch-action:pan-y;overscroll-behavior:contain;
  display:flex;flex-direction:column;will-change:top,left,width,height,border-radius;
  box-shadow:0 4px 20px rgba(0,0,0,.10);}
.hero-card.animating{transition:top .42s cubic-bezier(.32,1.12,.58,1),left .42s cubic-bezier(.32,1.12,.58,1),width .42s cubic-bezier(.32,1.12,.58,1),height .42s cubic-bezier(.32,1.12,.58,1),border-radius .42s cubic-bezier(.32,1.12,.58,1),box-shadow .42s ease;}
.hero-card.closing{transition:top .34s cubic-bezier(.4,0,.2,1),left .34s cubic-bezier(.4,0,.2,1),width .34s cubic-bezier(.4,0,.2,1),height .34s cubic-bezier(.4,0,.2,1),border-radius .34s cubic-bezier(.4,0,.2,1),box-shadow .34s ease;}
.hero-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:20px 16px calc(18px + env(safe-area-inset-bottom));opacity:0;transition:opacity .18s ease .14s;}
.hero-body .msh{width:100%;max-width:100%;overflow-x:hidden}
.hero-card.animating .hero-body{opacity:1;}
.hero-card.closing .hero-body{opacity:0;transition:opacity .12s ease;}
/* ════ SHEET modal (bottom slide-up) ════ */
.sheet-backdrop{position:fixed;inset:0;z-index:80;pointer-events:none;
  background:rgba(0,0,0,0);transition:background .28s ease;}

/* ── Location action sheet ── */
.loc-action-sheet{display:flex;flex-direction:column;padding:0 0 8px;}
.loc-action-title{font-size:12px;color:var(--muted);font-weight:700;padding:8px 16px 12px;text-align:center;border-bottom:1px solid var(--line);margin-bottom:6px;}
.loc-action-item{display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;border-radius:10px;margin:0 6px;transition:background .12s;border:none;background:none;width:calc(100% - 12px);text-align:left;color:var(--ink);}

.loc-action-sep{height:1px;background:var(--line);margin:4px 16px;}

.app-fab-action{width:100%;min-height:56px;border:0;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 12px 30px rgba(18,38,35,.18);display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left;color:var(--ink);font-weight:900;cursor:pointer;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);}
.app-fab-action:active{transform:scale(.985);}
.app-fab-action-ic{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--t-green-bg);color:var(--teal);font-size:19px;flex-shrink:0;}
.app-fab-action.ai .app-fab-action-ic{background:var(--t-purple-bg);color:var(--ai);}
.app-fab-action-title{font-size:15px;line-height:1.2;}
.app-fab-action-sub{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
@keyframes fabFade{from{opacity:0}to{opacity:1}}
@keyframes fabSheetUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:640px){
  .app-fab-sheet{left:10px;right:10px;width:auto}
}

/* ── Plan B: smart selection on loc cards ── */
.loc-card-wrap{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;touch-callout:none;
}
/* Allow selection on text-content areas (so users can copy address, phone, notes) */
.loc-card-wrap .loc-addr,
.loc-card-wrap .loc-phone,
.loc-card-wrap .loc-phone a,
.loc-card-wrap .loc-note-pill,
.loc-card-wrap .loc-note-pill *{
  -webkit-user-select:text;user-select:text;
  -webkit-touch-callout:default;touch-callout:default;
}


/* ── Traveler card system (Plan A+D+E) ─────── */
.tv-card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
  border-left:4px solid var(--tv-ac,var(--teal));}
.tv-card:hover{border-color:var(--tv-ac);box-shadow:0 4px 14px rgba(0,0,0,.08);}
.tv-card.open{box-shadow:0 6px 18px rgba(0,0,0,.1);}
.tv-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
.tv-avatar{width:48px;height:48px;border-radius:50%;background:var(--tv-bg,var(--t-green-bg));
  display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
  border:2px solid var(--tv-ac,var(--teal));box-shadow:0 2px 6px rgba(0,0,0,.08);}
.tv-avatar-lg{width:64px;height:64px;font-size:32px;}
.tv-info{flex:1;min-width:0;}
.tv-name{font-weight:900;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tv-role{display:inline-flex;align-items:center;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;
  background:var(--tv-bg);color:var(--tv-fg);}
.tv-mini-stats{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}
.tv-del{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--muted);
  cursor:pointer;font-size:14px;flex-shrink:0;transition:background .15s,color .15s;}
.tv-del:hover{background:var(--t-rose-bg);color:var(--danger);}
.tv-detail{padding:0 14px 14px;border-top:1px solid var(--line);background:linear-gradient(180deg,var(--tv-bg) 0,transparent 60px);
  animation:tv-detail-in .25s ease;}
@keyframes tv-detail-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.tv-bio{font-size:13px;color:var(--ink);padding:10px 0;line-height:1.55;}
.tv-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px;}
.tv-stat-cell{background:rgba(255,255,255,.6);border-radius:10px;padding:8px 10px;text-align:center;}
.tv-stat-n{font-size:16px;font-weight:900;color:var(--tv-fg,var(--ink));}
.tv-stat-l{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.05em;margin-top:2px;}
.tv-add-section{margin-top:18px;padding-top:18px;border-top:2px dashed var(--line);}
.tv-add-title{font-size:13px;font-weight:900;color:var(--ink);margin-bottom:12px;letter-spacing:.04em;}
.tv-preview{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;
  background:var(--tv-bg);border-radius:14px;margin-bottom:14px;border:1px solid var(--tv-ac);}
.tv-preview-name{font-weight:900;font-size:15px;color:var(--tv-fg);}
.avatar-pick-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:180px;overflow-y:auto;
  padding:8px;background:var(--soft);border-radius:12px;border:1px solid var(--line);margin-bottom:14px;
  scrollbar-width:thin;}

.avatar-pick-grid::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}
@media (max-width:480px){
  .avatar-pick-grid{grid-template-columns:repeat(6,1fr);max-height:200px;}
}

/* ── v13 時間軸版型 ─────────────────────────── */
.tl-list{position:relative;padding-top:2px}
.tl-item{display:grid;grid-template-columns:48px 22px minmax(0,1fr);gap:0 6px;margin-bottom:12px;position:relative}
.tl-time{font-size:15px;font-weight:800;text-align:right;padding-top:13px;font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
.tl-time-empty{color:var(--muted);font-weight:700}
.tl-item.loc-now .tl-time{color:var(--t-green-fg);font-weight:900}
.tl-rail{position:relative;display:flex;justify-content:center;align-items:flex-start}
.tl-rail::before{content:'';position:absolute;top:-6px;bottom:-12px;left:50%;transform:translateX(-50%);width:2px;background:var(--line);border-radius:0}
.tl-item:first-child .tl-rail::before{top:16px}
.tl-item:last-child .tl-rail::before{bottom:auto;height:22px}
.tl-item:first-child:last-child .tl-rail::before{display:none}
.tl-dot{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line-2);margin-top:15px;flex-shrink:0;box-sizing:border-box}
.tl-item.loc-now .tl-dot{width:16px;height:16px;margin-top:13px;box-shadow:0 0 0 4px rgba(29,158,117,.14);animation:now-pulse 1.8s ease-in-out infinite}

.dtab-date{font-size:11px;opacity:.72;font-weight:800;margin-left:5px}
.dtab.on .dtab-date{opacity:.85}
.dtab-edit{font-size:11px;opacity:.9;margin-left:5px}
.section-title{cursor:pointer;border-radius:8px;transition:background .15s}
.section-title:active{background:rgba(15,94,94,.07)}
.empty-cta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty-cta .btn{min-height:44px;padding:10px 16px;font-size:14px}
.app-fab-tmpls{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:4px}
.app-fab-tmpl{border:0;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(18,38,35,.18);white-space:nowrap;animation:fabSheetUp .24s cubic-bezier(.32,1.08,.58,1)}

.undo-msg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo-btn{flex-shrink:0;border:0;border-radius:9px;background:var(--teal-soft);color:#fff;font-size:13px;font-weight:900;padding:8px 16px;cursor:pointer;min-height:36px}
.undo-btn:active{transform:scale(.96)}
.ai-step-box{background:var(--t-green-bg);border:1px solid var(--teal-edge);border-radius:var(--r);padding:12px;margin-bottom:14px}
.ai-step-title{font-size:12px;font-weight:900;color:var(--t-green-fg);margin-bottom:10px}
.ai-prompt-details summary{font-size:12px;font-weight:800;color:var(--teal);cursor:pointer;user-select:none}

@media (max-width:640px){

function linkify(t){
  return esc(String(t||'')).replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g,m=>{
    let url=m,tail='';
    const tm=url.match(/[)\]）】」.,。，、;；!?！？]+$/);
    if(tm){tail=tm[0];url=url.slice(0,-tail.length);}
    if(!url)return m;
    const href=url.startsWith('http')?url:'https://'+url;
    return `<a href="${href}" target="_blank" rel="noopener" class="note-link" onclick="event.stopPropagation()">${url}</a>`+tail;
  });
}

    _geoLast=Date.now();

    const timer=setTimeout(()=>ctl.abort(),GEO_TIMEOUT_MS);
    try{
      const res=await fetch(url,{signal:ctl.signal});
      if(!res.ok)throw new Error('http '+res.status);

    }finally{clearTimeout(timer);}

const _cityCtx={};
async function cityContext(city){
  city=String(city||'').trim();
  if(!city)return null;
  if(_cityCtx[city]!==undefined)return _cityCtx[city];
  const key='geocity:'+GEO_CACHE_VERSION+':'+city;
  try{
    const cached=localStorage.getItem(key);
    if(cached){
      const o=JSON.parse(cached);
      if(o?.missUntil&&o.missUntil>Date.now()){_cityCtx[city]=null;return null;}
      if(o?.cc){_cityCtx[city]=o;return o;}
    }
  }catch(e){console.warn('[trip]',e);}
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&accept-language=zh-TW&q='+encodeURIComponent(city);
    const data=await geoFetch(url);
    if(data?.length&&data[0].address?.country_code){
      const o={lat:Number(data[0].lat),lng:Number(data[0].lon),cc:String(data[0].address.country_code).toLowerCase()};
      _cityCtx[city]=o;
      try{localStorage.setItem(key,JSON.stringify(o));}catch(e){console.warn('[trip]',e);}
      return o;
    }
    // 真的查無此城市 → 短期記錄,避免重複查
    try{localStorage.setItem(key,JSON.stringify({missUntil:Date.now()+GEO_FAIL_TTL}));}catch(e){console.warn('[trip]',e);}
  }catch{/* 網路錯誤/被限流:不寫快取,下次再試 */}

async function geocodeLoc(l,city){

  const addr=String(l?.address||'').trim();
  const name=String(l?.name||'').trim();
  // 台灣地址常因門牌格式查不到，準備「去掉門牌號」的降級查詢（例：中正路247號 → 中正路）
  const noNum=addr.replace(/[0-9０-９]+(之[0-9０-９]+)?號.*$/,'').trim();
  // 從地址擷取台灣的縣市與鄉鎮區（例：桃園市 / 復興區），用來驗證查詢結果是否在正確縣市

  if(twCity){
    const after=addr.slice(addr.indexOf(twCity)+twCity.length);

  }

  const qs=[{q:mqLoc(l)},{q:addr,street:true},{q:name}];

    qs.push({q:[name,noNum].filter(Boolean).join(' ')},{q:noNum,street:true});
  }
  if(city&&name)qs.push({q:name+' '+city}); // 再用「名稱＋城市」搜一次

  if(twCity&&twDist)qs.push({q:twCity+twDist,admin:true});

    let cc='';

    else if(ctx?.cc)cc=ctx.cc;
    const ccParam=cc?'&countrycodes='+cc:'';
    // 城市上下文可用＝有解析到城市，且沒有跟文字判斷的國家衝突
    const ctxUsable=!!(ctx&&(!cc||cc===ctx.cc));

    const bias=ctxUsable?`&viewbox=${(ctx.lng-0.6).toFixed(3)},${(ctx.lat+0.6).toFixed(3)},${(ctx.lng+0.6).toFixed(3)},${(ctx.lat-0.6).toFixed(3)}&bounded=0`:'';
    const key='geo:'+GEO_CACHE_VERSION+':'+cc+':'+q;
    try{
      const cached=localStorage.getItem(key);
      if(cached){
        const obj=JSON.parse(cached);
        if(obj?.missUntil&&obj.missUntil>Date.now())continue;
        if(Number.isFinite(obj?.lat)&&Number.isFinite(obj?.lng))return obj;
      }
    }catch(e){console.warn('[trip]',e);}
    try{
      const url='https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=zh-TW'+ccParam+bias+'&q='+encodeURIComponent(q);

        continue;
      }
      // 多筆候選的三道篩選:
      // 1) 縣市驗證:地址寫了「桃園市」,結果的所在縣市就必須含「桃園」,否則就是撞名抓錯

      }
      if(!best)continue;
      const p={lat:best.lat,lng:best.lng};
      try{localStorage.setItem(key,JSON.stringify(p));}catch(e){console.warn('[trip]',e);}

      for(const [p,raw] of Object.entries(shares)){const sh=convertAmount(raw,e.currency||'TWD',cur);if(p===e.paidBy)continue;if(p in b)b[p]-=sh;if(e.paidBy in b)b[e.paidBy]+=sh;}
      continue;
    }
    if(!e.splitWith?.length)continue;const sh=expValue(e,cur)/e.splitWith.length;for(const p of e.splitWith){if(p===e.paidBy)continue;if(p in b)b[p]-=sh;if(e.paidBy in b)b[e.paidBy]+=sh;}
  }

  let de=Object.entries(b).filter(([,v])=>v<-0.01).map(([n,v])=>({n,v:-v})).sort((a,x)=>x.v-a.v);

}

function tomb(id){if(!id)return;const t={...(S.trash||{})};t[id]=Date.now();S.trash=t;}
function _itemSig(o){const c={...o};delete c._u;return JSON.stringify(c);}
// 針對這次要寫出的資料，與上次雲端快照比對：有變動的項目蓋上 _u 時間戳
function stampChanges(list,prevList){
  const prev=new Map((prevList||[]).map(o=>[o.id,o]));
  return (list||[]).map(o=>{
    const p=prev.get(o.id);
    if(!p)return o._u?o:{...o,_u:Date.now()};
    if(_itemSig(p)!==_itemSig(o))return {...o,_u:Date.now()};
    return o;
  });
}
function mergeById(local,remote,trash){
  const t=trash||{};
  const out=new Map();
  for(const o of (remote||[]))if(o&&o.id&&!t[o.id])out.set(o.id,o);
  for(const o of (local||[])){
    if(!o||!o.id||t[o.id])continue;
    const r=out.get(o.id);
    if(!r||((o._u||0)>=(r._u||0)))out.set(o.id,o);
  }
  return [...out.values()];
}
function mergeDays(local,remote,trash){
  const merged=mergeById(local,remote,trash);
  const lmap=new Map((local||[]).map(d=>[d.id,d])),rmap=new Map((remote||[]).map(d=>[d.id,d]));
  return merged.map(d=>{
    const l=lmap.get(d.id),r=rmap.get(d.id);
    if(l&&r)return {...d,locations:mergeById(l.locations,r.locations,trash)};
    return d;
  });
}
function buildTrip(){

    return {...d,locations:stampChanges(d.locations,pd?.locations)};
  });
  return {tripName:S.tripName,cover:S.cover,coverPos:S.coverPos||'30%',budget:Number(S.budget||0),settleCurrency:S.settleCurrency||'TWD',
    days,
    travelers:S.travelers,travelerIcons:S.travelerIcons||{},travelerMeta:S.travelerMeta||{},
    expenses:stampChanges(S.expenses,prev.expenses),
    memo:stampChanges(S.memo,prev.memo),
    wishlist:stampChanges(S.wishlist,prev.wishlist),
    wlCats:stampChanges(S.wlCats,prev.wlCats),
    trash:S.trash||{},
    updatedAt:new Date().toISOString()};
}

function exps(te){

function splt(b,tx,te){
  const sharedExpenses=S.expenses.filter(e=>!isPersonalExp(e));
  const personMini=t=>{const c=getTvColor(t),ic=S.travelerIcons?.[t]||'🙂';return`<div class="split-txn-person" style="--tv-bg:${c.bg};--tv-fg:${c.fg};--tv-ac:${c.accent};"><div class="split-avatar">${ic}</div><div class="split-txn-name">${esc(t)}</div></div>`;};
  const personShare=(e,t)=>{
    if(e.shares)return Number(e.shares[t]||0);
    return (e.splitWith||[]).includes(t)?expValue(e)/Math.max(1,(e.splitWith||[]).length):0;
  };
  const br=S.travelers.map(t=>{
    const v=b[t]||0,paid=sharedExpenses.filter(e=>e.paidBy===t).reduce((s,e)=>s+expValue(e),0),count=sharedExpenses.filter(e=>e.paidBy===t).length,shared=sharedExpenses.filter(e=>(e.splitWith||[]).includes(t)||e.shares?.[t]).length,pos=v>=0;
    const ic=S.travelerIcons?.[t]||'🙂',c=getTvColor(t),meta=(S.travelerMeta||{})[t]||{};
    const open=S.splitExpanded===t;
    const related=sharedExpenses.filter(e=>e.paidBy===t||personShare(e,t)>0);
    const detail=related.length?`<div class="split-detail-title">相關分帳明細</div>${related.map(e=>{
      const share=personShare(e,t),isPayer=e.paidBy===t;
      return`<div class="split-exp-mini"><div class="split-exp-line"><div class="split-exp-name">${TI(CTI[e.category]||'map-pin',13)} ${esc(e.item)}</div><div style="font-weight:900;">${fmt(expValue(e))}</div></div><div class="split-exp-meta">${isPayer?'我先付款':'我有分擔'}${share?` · 負擔 ${fmt(convertAmount(share,e.currency||'TWD',S.settleCurrency||'TWD'))}`:''}${e.paidBy?` · 付款人 ${esc(S.travelerIcons?.[e.paidBy]||'')} ${esc(e.paidBy)}`:''}</div></div>`;
    }).join('')}`:`<div class="split-detail-title">相關分帳明細</div><div class="mini">目前沒有共同分帳明細</div>`;
    return`<div class="split-person${open?' open':''}" style="--tv-bg:${c.bg};--tv-fg:${c.fg};--tv-ac:${c.accent};" onclick="toggleSplitPerson('${jsq(t)}')">
      <div class="split-person-head"><div class="split-avatar">${ic}</div><div style="min-width:0;flex:1;"><div class="split-name-row"><div class="split-name">${esc(t)}</div>${meta.role?`<div class="split-role">${esc(meta.role)}</div>`:''}</div>${meta.bio?`<div class="split-bio-inline">${TI('message-circle',12)} ${esc(meta.bio)}</div>`:''}</div><div class="split-toggle">⌄</div></div>
      <div class="split-balance ${pos?'receive':'pay'}">${pos?`+ ${fmt(Math.abs(v))} 應收`:`${fmt(Math.abs(v))} 應付`}</div>
      ${open?`<div class="split-detail"><div class="split-metrics"><div class="split-metric"><div class="split-metric-n">${fmt(paid)}</div><div class="split-metric-l">共同分帳已付</div></div><div class="split-metric"><div class="split-metric-n">${count} / ${shared}</div><div class="split-metric-l">付款 / 分擔筆數</div></div></div>${detail}</div>`:''}
    </div>`;
  }).join('');
  const tc=tx.length?tx.map(t=>`<div class="split-txn">${personMini(t.from)}<div><div style="font-size:12px;color:var(--t-amber-fg);font-weight:800;">轉帳給</div><div style="font-size:16px;font-weight:900;color:var(--t-amber-fg);">${fmt(t.amount)}</div></div>${personMini(t.to)}</div>`).join(''):`<div style="text-align:center;padding:16px;color:var(--muted);font-size:14px;background:var(--paper);border-radius:var(--r);border:1px solid var(--line);">${sharedExpenses.length?TI('circle-check',14)+' 共同分帳已平衡！':'尚無共同分帳記錄'}</div>`;
  return`<div class="sh">旅伴結算</div><div class="split-people">${br}</div><div class="sh">付款方式</div>${tc}`;
}

function getTvStats(name){
  const exps=S.expenses||[];
  let paidCount=0,paidTotal=0,sharedCount=0;
  const cur=S.settleCurrency||'TWD';
  for(const e of exps){
    const amt=convertAmount(Number(e.amount||0),e.currency||'TWD',cur);
    if(e.paidBy===name){paidCount++;paidTotal+=amt;}
    if((e.splitWith||[]).includes(name))sharedCount++;
  }
  return{paidCount,paidTotal,sharedCount,avg:paidCount?paidTotal/paidCount:0};
}

function saveTvProfile(){
  const name=FM.editTvName;
  if(!name)return;
  const next=cleanName(document.getElementById('tv-edit-name')?.value??FM.editTvNewName);
  if(!next){alert('請輸入旅伴名稱');return;}
  if(next!==name&&S.travelers.includes(next)){alert('這個名字已被其他旅伴使用');return;}
  const tvMeta={...(S.travelerMeta||{})};
  if(next!==name){
    const icons={...(S.travelerIcons||{})};
    icons[next]=icons[name]||'🙂';delete icons[name];delete tvMeta[name];
    tomb('tv:'+name);
    S.trash={...S.trash,['tv:'+next]:-Date.now()};
    S.travelers=S.travelers.map(t=>t===name?next:t);
    S.travelerIcons=icons;
    S.expenses=S.expenses.map(e=>{
      if(e.paidBy!==name&&!e.splitWith?.includes(name)&&!Object.prototype.hasOwnProperty.call(e.shares||{},name))return e;
      const updated={...e,_u:Date.now()};
      if(e.paidBy===name)updated.paidBy=next;
      if(e.splitWith)updated.splitWith=e.splitWith.map(t=>t===name?next:t);
      if(Object.prototype.hasOwnProperty.call(e.shares||{},name)){
        updated.shares={...e.shares,[next]:e.shares[name]};delete updated.shares[name];
      }
      return updated;
    });
    if(S.tvExpanded===name)S.tvExpanded=next;
    if(S.splitExpanded===name)S.splitExpanded=next;
  }
  tvMeta[next]={...(S.travelerMeta?.[name]||{}),name:next,_u:Date.now(),role:(FM.editTvRole||'').trim(),bio:(FM.editTvBio||'').trim()};
  S={...S,travelerMeta:tvMeta,travelerIcons:{...S.travelerIcons,[next]:FM.editTvIcon||S.travelerIcons?.[next]||'🙂'},modal:{t:'tv'}};
  psave();
  _refreshHeroContent();
}

function normalizeExpenseDate(v){
  v=String(v||'').trim();
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=v.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);
  if(m)return`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  return '';
}
function formatExpenseDate(v){
  const d=normalizeExpenseDate(v);
  if(!d)return esc(v||'');
  const [,m,day]=d.match(/^\d{4}-(\d{2})-(\d{2})$/)||[];
  return m&&day?`${Number(m)}/${Number(day)}`:d;
}
function expenseDateKey(e){
  return normalizeExpenseDate(e?.date)||'no-date';
}
function expenseByDay(key){
  return (S.expenses||[]).filter(e=>expenseDateKey(e)===key);
}
function expenseDayKeys(){
  const seen=new Set();
  const keys=['all'];
  (S.days||[]).forEach(d=>{
    const k=normalizeExpenseDate(d.date);
    if(k&&(S.expenses||[]).some(e=>expenseDateKey(e)===k)&&!seen.has(k)){
      seen.add(k);keys.push(k);
    }
  });
  [...new Set((S.expenses||[]).map(expenseDateKey))]
    .filter(k=>!seen.has(k))
    .sort((a,b)=>{
      if(a==='no-date')return 1;
      if(b==='no-date')return -1;
      return a.localeCompare(b);
    })
    .forEach(k=>{seen.add(k);keys.push(k);});
  return keys;

  const h=Number(m[1]),mi=Number(m[2]);

}

function uploadCover(file){
  if(!file)return;
  if(!file.type.startsWith('image/')){alert('請選擇圖片檔');return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
      let q=.8,data=canvas.toDataURL('image/jpeg',q);
      while(data.length>300000&&q>.45){q-=.1;data=canvas.toDataURL('image/jpeg',q);}
      if(data.length>300000){alert('這張圖片壓縮後仍超過 300KB。因為雲端同步的單份旅程資料上限是 1MB，封面需要控制在 300KB 以內，請換一張較小或較單純的圖片。');return;}
      setD({cover:data,modal:null});
    };
    img.onerror=()=>alert('圖片讀取失敗，請換一張試試。');
    img.src=reader.result;
  };
  reader.onerror=()=>alert('圖片讀取失敗，請換一張試試。');
  reader.readAsDataURL(file);
}

function getNowLocId(locs,day=S.days[S.dayIdx]){
  const clock=tripClock();
  if(day?.date!==clock.date)return null;
  if(!locs?.length)return null;
  const nowMins=clock.minutes;
  const withTime=locs.filter(l=>l.time);
  // No times at all → highlight first location
  if(!withTime.length)return null;
  let upId=null,upDiff=Infinity,paId=null,paDiff=Infinity;
  for(const l of withTime){
    const[h,m]=l.time.split(':').map(Number),lm=h*60+m,d=lm-nowMins;
    if(d>=0&&d<upDiff){upDiff=d;upId=l.id;}
    else if(d<0&&-d<paDiff){paDiff=-d;paId=l.id;}
  }
  // Prefer upcoming; if all past use last passed; if nothing matched use first with time
  return upDiff===0?upId:paId;
}

function findTodayIdx(){
  const today=tripClock().date,todayMs=new Date(today).getTime();
  // 1. Exact date match
  let di=S.days.findIndex(d=>d.date===today);
  if(di>=0)return di;
  // 2. Find nearest dated day (within 14 days)
  let best=Infinity,bestIdx=-1;
  S.days.forEach((d,i)=>{
    if(!d.date)return;
    const diff=Math.abs(new Date(d.date).getTime()-todayMs);
    if(diff<best){best=diff;bestIdx=i;}
  });
  if(bestIdx>=0&&best<=14*864e5)return bestIdx;
  // 3. No dates at all — use current dayIdx (don't force day 0)
  return S.dayIdx;
}

function parseAI(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const days=[];
  let cur=null;
  const timeRe=/^([0-1]?\d|2[0-3]):([0-5]\d)/;
  const dayRe=/^(?:day\s*[-–]?\s*(\d+)|第\s*(\d+)\s*天|Day\s*(\d+)|\*{0,3}第?\s*(\d+)\s*天\*{0,3})/i;
  const cityRe=/[（(]([^）)]+)[）)]/;
  const dateRe=/(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})日?/;
  const bulletRe=/^[-•◆▶️*]+\s+/;
  const numRe=/^[\d\uff10-\uff19]+[.\uff0e\s、]/;
  const normDate=s=>{
    const m=String(s||'').match(dateRe);
    if(!m)return'';
    return`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  };
  const cleanDayText=s=>String(s||'')
    .replace(/^(日期|標題|城市|city|title|date)\s*[:：]\s*/i,'')
    .trim();
  for(let line of lines){
    line=line.replace(/^\*+|\*+$/g,'').replace(/^#+\s*/,'').trim();
    if(!line)continue;
    const dm=line.match(dayRe);
    if(dm){
      const n=Number(dm[1]||dm[2]||dm[3]||dm[4]);
      const parts=line.split('|').map(cleanDayText).filter(Boolean);
      const cityM=line.match(cityRe);
      const date=normDate(line);
      let city=cityM?cityM[1].trim():'';
      let title='';
      if(parts.length>=2){
        const afterDay=parts.slice(1);
        const titlePart=afterDay.find(p=>!normDate(p)&&!/^(東京|大阪|京都|台北|高雄|沖繩|首爾|釜山|曼谷|新加坡|Tokyo|Osaka|Kyoto)$/i.test(p));
        const cityPart=afterDay.find(p=>!normDate(p)&&p!==titlePart);
        title=titlePart||'';
        city=city||cityPart||'';
      }else{
        title=line.replace(dayRe,'').replace(cityRe,'').replace(dateRe,'').replace(/日期|標題|城市|[:：|]/g,'').replace(/^[\s:：\-–—]+/,'').trim();
      }
      const finalTitle=title?`第${n}天 ${title}`:`第${n}天`;
      cur={title:finalTitle,date,city,locations:[]};
      days.push(cur);continue;
    }
    if(!cur){cur={title:'行程',date:'',city:'',locations:[]};days.push(cur);}
    let l=line.replace(bulletRe,'').replace(numRe,str=>str.replace(/\S+\s*/,'')).trim();
    // Extract time
    const tm=l.match(timeRe);
    let time='';
    if(tm){time=tm[0].padStart(5,'0');l=l.slice(tm[0].length).replace(/^[\s:：\-–—|]+/,'').trim();}
    // Pipe format:
    // New: HH:MM | name | address | phone | notes | category
    // Old: HH:MM name | address | phone | notes | category
    let name=l,notes='',address='',phone='',category='';
    if(l.includes('|')){
      const parts=l.split('|').map(s=>s.trim());
      if(!time&&/^([0-1]?\d|2[0-3]):([0-5]\d)$/.test(parts[0]||'')){
        time=parts[0].padStart(5,'0');
        name=parts[1]||'';
        address=parts[2]||'';
        phone=parts[3]||'';
        notes=parts[4]||'';
        const rawCat=(parts[5]||'').trim();
        if(CATS.includes(rawCat))category=rawCat;
      }else{
        name=parts[0]||'';
        address=parts[1]||'';
        phone=parts[2]||'';
        notes=parts[3]||'';
        const rawCat=(parts[4]||'').trim();
        if(CATS.includes(rawCat))category=rawCat;
      }
    } else {
      // Fallback: name - notes
      const sepRe=/\s+[-–—]\s+/;
      const si=l.search(sepRe);
      if(si>0&&si<40){name=l.slice(0,si).trim();notes=l.slice(si).replace(/^\s*[-–—]\s*/,'').trim();}
      // Inline 地址：
      const addrM=notes.match(/地址[：:]\s*(.+)/);
      if(addrM){address=addrM[1].trim();notes=notes.replace(addrM[0],'').trim();}
    }
    name=name.replace(/^\d+\.\s*/,'').replace(/^[📍🗺️🎫🍜🏨🚗🛍️📌]\s*/,'').trim();
    if(name.length<1||name.length>80)continue;
    const cat=category||ac(`${name} ${notes} ${address}`);
    cur.locations.push({id:uid(),name,time,address,phone,notes,category:cat,reservation:''});
  }
  return days.map(d=>({...d,locations:sortLocationsByTime(d.locations)})).filter(d=>d.locations.length>0||days.length===1);
}

// Pointer-based drag for touch devices
let _touchDrag={active:false,dayId:null,locId:null,ghost:null,lastOver:null};
function startTouchDrag(e,dayId,locId){
  if(e.pointerType==='mouse'){
    // For mouse, use native HTML5 drag on the whole card instead
    const card=e.currentTarget.closest('.loc-card-wrap');
    if(card){card.setAttribute('draggable','true');card.ondragstart=ev=>dragStart(ev,dayId,locId);}
    return;
  }
  e.preventDefault();
  _touchDrag={active:true,dayId,locId,ghost:null,lastOver:null};
  const card=e.currentTarget.closest('.loc-card-wrap');
  if(card){
    card.classList.add('dragging');
    const g=card.cloneNode(true);
    g.style.cssText=`position:fixed;z-index:999;opacity:.85;pointer-events:none;width:${card.offsetWidth}px;left:${card.getBoundingClientRect().left}px;top:${card.getBoundingClientRect().top}px;transform:scale(1.02);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);`;
    document.body.appendChild(g);_touchDrag.ghost=g;
  }
  document.addEventListener('pointermove',_onTouchMove,{passive:false});
  document.addEventListener('pointerup',_onTouchEnd,{once:true});
}
function _onTouchMove(e){
  if(!_touchDrag.active)return;
  e.preventDefault();
  const edge=86;
  const maxStep=18;
  if(e.clientY<edge){
    window.scrollBy({top:-Math.max(4,Math.round((edge-e.clientY)/edge*maxStep)),behavior:'instant'});
  }else if(e.clientY>window.innerHeight-edge){
    window.scrollBy({top:Math.max(4,Math.round((e.clientY-(window.innerHeight-edge))/edge*maxStep)),behavior:'instant'});
  }
  if(_touchDrag.ghost){_touchDrag.ghost.style.top=(e.clientY-40)+'px';_touchDrag.ghost.style.left=(e.clientX-80)+'px';}
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const wrap=el?.closest?.('.loc-card-wrap');
  const overId=wrap?.dataset?.locid;
  if(overId&&overId!==_touchDrag.locId){
    if(_touchDrag.lastOver)_touchDrag.lastOver.classList.remove('drag-over');
    wrap.classList.add('drag-over');_touchDrag.lastOver=wrap;
  }
}
function _onTouchEnd(e){
  document.removeEventListener('pointermove',_onTouchMove);
  if(_touchDrag.ghost)_touchDrag.ghost.remove();
  document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
  if(_touchDrag.lastOver){
    const toId=_touchDrag.lastOver.dataset.locid;
    _touchDrag.lastOver.classList.remove('drag-over');
    if(toId&&toId!==_touchDrag.locId){
      const days=JSON.parse(JSON.stringify(S.days));
      const day=days.find(d=>d.id===_touchDrag.dayId);
      if(day){const fi=day.locations.findIndex(l=>l.id===_touchDrag.locId),ti=day.locations.findIndex(l=>l.id===toId);
        if(fi>=0&&ti>=0){const[item]=day.locations.splice(fi,1);day.locations.splice(ti,0,item);setD({days});}}
    }
  }
  _touchDrag={active:false,dayId:null,locId:null,ghost:null,lastOver:null};
}
function dragOver(e){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';const wrap=e.currentTarget;wrap.classList.add('drag-over');}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
function dragDrop(e,dayId,locId){
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(!dragState.locId||dragState.locId===locId||dragState.dayId!==dayId)return;
  const days=JSON.parse(JSON.stringify(S.days));
  const day=days.find(d=>d.id===dayId);
  if(!day)return;
  const fi=day.locations.findIndex(l=>l.id===dragState.locId);
  const ti=day.locations.findIndex(l=>l.id===locId);
  if(fi<0||ti<0)return;
  const [item]=day.locations.splice(fi,1);
  day.locations.splice(ti,0,item);
  setD({days});
}
function dragEnd(){
  document.querySelectorAll('.dragging,.drag-over').forEach(el=>el.classList.remove('dragging','drag-over'));
  dragState={dayId:null,locId:null};
}
function dLoc(dayId,locId){
  const days=JSON.parse(JSON.stringify(S.days));
  const day=days.find(d=>d.id===dayId);
  if(!day)return;
  const idx=day.locations.findIndex(l=>l.id===locId);
  if(idx<0)return;
  const [removed]=day.locations.splice(idx,1);
  setD({days});
  undoToast(`已刪除「${_trunc(removed.name)}」`,()=>{
    const days2=JSON.parse(JSON.stringify(S.days));
    const d2=days2.find(d=>d.id===dayId);
    if(!d2)return;
    d2.locations.splice(Math.min(idx,d2.locations.length),0,removed);
    setD({days:days2});
  });
}

      </div>

        <button class="btn bp" style="width:100%;padding:13px;font-size:14px;" onclick="closeNoteSheet();_heroOrigin=null;setTimeout(()=>oLoc('${l.id}'),320)">✏️ 編輯備註</button>
      </div>
    </div>`;
  document.body.appendChild(card);

  // Swipe-down to close on mobile
  let touchStartY=0, touchCurY=0;
  card.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY;},{passive:true});
  card.addEventListener('touchmove',e=>{
    touchCurY=e.touches[0].clientY;
    const dy=Math.max(0,touchCurY-touchStartY);
    if(dy>0){
      card.style.transition='none';
      card.style.transform=`translateY(${dy*0.4}px) scale(${1-dy*0.0008})`;
      bd.style.opacity=String(Math.max(0,1-dy/250));
    }
  },{passive:true});
  card.addEventListener('touchend',()=>{
    card.style.transform='';
    bd.style.opacity='';
    if(touchCurY-touchStartY>80) closeNoteSheet();
    else{
      card.style.transition='';
      card.classList.add('expanding');
    }
    touchStartY=0; touchCurY=0;
  });

  // Expand animation: two rAF to ensure start state is painted first
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bd.classList.add('open');
    card.classList.add('expanding');
    card.style.top=`${ty}px`;
    card.style.left=`${tx}px`;
    card.style.width=`${tw}px`;
    card.style.height=`${th}px`;
    card.style.borderRadius='22px';
    card.style.boxShadow='0 20px 60px rgba(0,0,0,.25)';
  }));

  // Store origin for collapse
  card._origin={top:src.top,left:src.left,width:src.width,height:src.height};
}

function closeNoteSheet(){

function uploadBuyImage(file){
  if(!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('請選擇 JPG、PNG 或 WebP 圖片；HEIC 請先轉成 JPG。');return;}
  if(file.size>12*1024*1024){alert('原始圖片請小於 12MB');return;}
  const draft=FM;
  if(draft.buyImageBusy)return;
  draft.buyImageBusy=true;_refreshHeroContent();
  const img=new Image();
  const source=URL.createObjectURL(file);
  const active=()=>FM===draft&&S.modal?.t==='buy_edit';
  const finish=()=>{URL.revokeObjectURL(source);draft.buyImageBusy=false;if(active())_refreshHeroContent();};
  img.onerror=()=>{if(active())alert('無法讀取圖片，請換一張 JPG 或 PNG 試試。');finish();};
  img.onload=()=>{
    try{
      if(!active())return;
      if(!img.naturalWidth||img.naturalWidth*img.naturalHeight>40000000)throw Error('圖片尺寸太大，請先縮小後再上傳。');
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      if(!ctx)throw Error('此瀏覽器無法處理圖片，請換瀏覽器再試。');
      let edge=720,data='';
      while(edge>=180){
        const scale=Math.min(1,edge/Math.max(img.naturalWidth,img.naturalHeight));
        canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
        for(const quality of [.8,.65,.5]){data=canvas.toDataURL('image/jpeg',quality);if(data.length<=40000)break;}
        if(safeBuyImage(data))break;
        edge=Math.floor(edge*.75);
      }
      if(!safeBuyImage(data))throw Error('圖片壓縮後仍過大，請裁切商品部分後再上傳。');
      draft.buyImage=data;
    }catch(e){if(active())alert(e.message||'圖片處理失敗，請換一張試試。');}
    finally{finish();}
  };
  img.src=source;
}
function saveBuy(){
  if(FM.buyImageBusy){alert('圖片仍在處理，請稍候再儲存');return;}
  const text=String(FM.buyName||'').trim(),quantity=Number(FM.buyQuantity);
  if(!text){alert('請填寫商品名稱');return;}
  if(!Number.isInteger(quantity)||quantity<1||quantity>999){alert('數量請填入 1–999 的整數');return;}
  const old=buyItems().find(m=>m.id===FM.buyId);
  if(FM.buyId&&!old){alert('這筆商品已被刪除，請重新新增');return;}
  const item={...old,id:old?.id||uid(),kind:'purchase',cat:'待買',text:text.slice(0,120),quantity,shop:String(FM.buyShop||'').trim().slice(0,200),note:String(FM.buyNote||'').trim().slice(0,1000),area:String(FM.buyArea||'').trim().replace(/\s+/g,' ').slice(0,60),purchaseCategory:String(FM.buyCategory||'').trim().slice(0,30)||'其他',image:safeBuyImage(FM.buyImage),done:old?.done||false};
  const memo=old?S.memo.map(m=>m.id===old.id?item:m):[...(S.memo||[]),item];
  const projectedBytes=new Blob([JSON.stringify({...S,memo})]).size;
  const currentBytes=new Blob([JSON.stringify(S)]).size;
  if(projectedBytes>850000&&projectedBytes>=currentBytes){alert('旅程資料接近同步容量上限，請先移除一些商品圖片或縮小封面，再儲存。原資料尚未變更。');return;}
  setD({memo,modal:null});
}

// ── Undo 刪除系統：刪除後 6 秒內可一鍵復原 ─────────────
let _undoTimer=null;
function _trunc(s,n=14){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s;}
function undoToast(msg,undoFn){
  document.getElementById('_undoToast')?.remove();
  if(_undoTimer){clearTimeout(_undoTimer);_undoTimer=null;}
  const t=document.createElement('div');
  t.id='_undoToast';t.className='undo-toast';
  t.innerHTML=`<span class="undo-msg">${esc(msg)}</span><button class="undo-btn">復原</button>`;
  t.querySelector('.undo-btn').onclick=()=>{if(_undoTimer){clearTimeout(_undoTimer);_undoTimer=null;}t.remove();undoFn();};
  document.body.appendChild(t);
  _undoTimer=setTimeout(()=>{t.remove();_undoTimer=null;},6000);
}
function dDay(dayId){
  if(S.days.length<=1)return;
  const idx=S.days.findIndex(d=>d.id===dayId);
  if(idx<0)return;
  const snapshot=JSON.parse(JSON.stringify(S.days));
  const prevIdx=S.dayIdx;
  const title=S.days[idx].title||`Day ${idx+1}`;
  tomb(dayId);
  setD({days:S.days.filter(d=>d.id!==dayId),dayIdx:Math.max(0,S.dayIdx-1)});
  undoToast(`已刪除「${_trunc(title)}」整天行程`,()=>setD({days:snapshot,dayIdx:prevIdx}));
}
function dDayFromModal(){
  const id=S.modal?.dayId;
  if(!id)return;
  setU({modal:null});
  setTimeout(()=>dDay(id),380);

function parseReceiptText(text){
  const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const nums=[...text.matchAll(/(?:NT\\$|TWD|TOTAL|總計|合計|金額)?\\s*([0-9]{2,6}(?:[.,][0-9]{1,2})?)/gi)].map(m=>Number(m[1].replace(',','.'))).filter(n=>n>0);
  const amount=Math.max(...nums,0);
  const item=lines.find(l=>/[\\p{Script=Han}A-Za-z]{2,}/u.test(l)&&!/發票|統一|總計|合計|小計|金額/.test(l))||'收據';
  return{item,amount,category:ac(text+' '+item)};
}
async function readReceipt(file){
  if(!file)return;
  const st=document.getElementById('ocr-status');
  if(st)st.textContent='正在讀取圖片...';
  const ok=await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  if(!ok||!window.Tesseract){if(st)st.textContent='辨識套件載入失敗，請手動輸入。';return;}
  try{
    st.textContent='正在 AI 辨識收據，可能需要幾秒...';
    const res=await Tesseract.recognize(file,'eng+chi_tra');
    const p=parseReceiptText(res.data.text||'');
    if(p.item)FM.item=p.item;
    if(p.amount)FM.amount=String(Math.round(p.amount));
    FM.category=p.category||ac(FM.item);
    if(typeof _refreshHeroContent==='function')_refreshHeroContent();else render();
    setTimeout(()=>{const s=document.getElementById('ocr-status');if(s)s.textContent=`已帶入：${FM.item||'收據'} / ${FM.amount||'未抓到金額'} / ${FM.category}`;},0);
  }catch{if(st)st.textContent='辨識失敗，請換一張更清楚的照片或手動輸入。';}
}

  const item=wlItems().find(i=>i.id===itemId);

  const days=JSON.parse(JSON.stringify(S.days));
  const day=days[dayIdx];
  if(!day)return;

  day.locations.push({id:uid(),sourceWishlistId:item.id,name:item.name,address:item.address||'',phone:item.phone||'',time:time||'',notes:item.note||'',category:appCat,reservation:''});

function wlCopyPrompt(){

  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>{_wlCopyFallback(text);done();});}

function _wlCopyFallback(text){
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0;';
  document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');}catch(e){console.warn('[trip]',e);}document.body.removeChild(ta);
}

const WL_CAT_TEXT_MAP={'咖啡廳':'cafe','美食':'food','餐廳':'food','伴手禮':'souvenir','紀念品':'souvenir','景點':'attraction','購物':'shopping','住宿':'hotel','飯店':'hotel','其他':'other'};

function _parseWlImport(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l&&l.includes('|'));
  const items=[];
  for(const line of lines){
    const parts=line.split('|').map(p=>p.trim());
    if(parts.length<2)continue;
    const [catText,name,address='',phone='',note='',area='']=parts;
    if(!name)continue;
    const cat=WL_CAT_TEXT_MAP[catText]||'other';
    items.push({id:uid(),name,cat,address,phone,note,area,added:false});
  }
  return items;
}

function wlPreviewImport(){
  const text=document.getElementById('wl-import-box')?.value||'';
  const items=_parseWlImport(text);
  const prev=document.getElementById('wl-import-preview');
  if(prev)prev.innerHTML=items.length?TI('circle-check',12)+` 偵測到 ${items.length} 個地點可匯入`:'';
}

function wlConfirmImport(){
  const text=document.getElementById('wl-import-box')?.value||'';
  const newItems=_parseWlImport(text);
  if(!newItems.length){alert('未偵測到有效格式，請確認貼上的格式正確。');return;}
  const wishlist=[...(S.wishlist||[]),...newItems];

  document.body.appendChild(t);setTimeout(()=>t.remove(),2100);
}


// ════ HERO & SHEET modal engine ════════════════════════
// Hero modal types (large forms) — open from trigger element
const HERO_TYPES=new Set(['loc','exp','nd','ed','wl_add','wl_import','wl_edit','wl_day','wl_cat','import','tv','tvEdit','cover','tools','help','note','memo_add','memo_import','buy_edit','tripGate']);
// Sheet modal types (compact) — slide up from bottom
const SHEET_TYPES=new Set([]);

let _heroOrigin=null; // {top,left,width,height} of trigger element

// Call this instead of direct setU for modals to capture trigger position
function openModal(el, modalObj){
  if(el && HERO_TYPES.has(modalObj.t)){
    const r=el.getBoundingClientRect();
    _heroOrigin={top:r.top,left:r.left,width:r.width,height:r.height};
  } else {
    _heroOrigin=null;
  }
  setU({modal:modalObj});
}

// Override render() to mount hero/sheet after innerHTML swap
const _origRender=render;

function _mountModalOverlay(){
  const m=S.modal;
  if(!m)return;
  // Remove old overlays
  document.getElementById('_heroBackdrop')?.remove();
  document.getElementById('_heroCard')?.remove();
  document.getElementById('_sheetBackdrop')?.remove();
  document.getElementById('_sheetWrap')?.remove();

  const content=_getModalContent(m);
  if(!content)return;

  if(HERO_TYPES.has(m.t)){
    _mountHero(content, m);
  } else {
    _mountSheet(content, m);
  }
}

function _getModalContent(m){
  let c='';
  if(m.t==='tripGate')c=mTripGate();
  else if(m.t==='buy_edit')c=buyModal();
  else if(m.t==='loc')c=mLoc();
  else if(m.t==='nd'||m.t==='ed')c=mDay();
  else if(m.t==='exp')c=mExp();
  else if(m.t==='tv')c=mTv();
  else if(m.t==='cover')c=mCover();
  else if(m.t==='tools')c=mTools();
  else if(m.t==='import')c=mImport();
  else if(m.t==='note')c=mNote();
  else if(m.t==='help')c=mHelp();
  else if(m.t==='memo_add')c=mMemoAdd();
  else if(m.t==='memo_import')c=buildMemoImportModal();
  else if(m.t==='tvEdit')c=buildTvEditModal();
  else if(m.t==='wl_add')c=buildWlAddModal();else if(m.t==='wl_cat')c=buildWlCatModal();
  else if(m.t==='wl_import')c=buildWlImportModal();
  else if(m.t==='wl_edit')c=buildWlEditModal();
  else if(m.t==='wl_day')c=mWlDay();
  return c||null;
}

function _mountHero(content, m){
  const vw=window.innerWidth, vh=window.innerHeight;
  const tw=Math.min(vw*0.94,600);
  const th=Math.min(vh*0.90,760);
  const tx=(vw-tw)/2, ty=Math.max(16,(vh-th)/2);
  const o=_heroOrigin||{top:vh/2,left:vw/2,width:40,height:40};

  const bd=document.createElement('div');
  bd.id='_heroBackdrop'; bd.className='hero-backdrop';
  bd.onclick=()=>setU({modal:null});
  document.body.appendChild(bd);

  const card=document.createElement('div');
  card.id='_heroCard'; card.className='hero-card';
  card.style.cssText=`top:${o.top}px;left:${o.left}px;width:${o.width}px;height:${o.height}px;border-radius:10px;`;
  // Wrap existing msh-style content in hero-body
  card.innerHTML=`<div class="hero-body"><div class="msh" style="border-radius:0;padding:0;max-height:none;box-shadow:none;overflow-x:hidden;overflow-y:visible;">${content}</div></div>`;
  document.body.appendChild(card);

  // Swipe down only from the modal header. Form content stays locked to vertical scroll.
  let ty0=0,cy0=0,swipeHead=false;
  card.addEventListener('touchstart',e=>{
    swipeHead=!!e.target.closest('.mhd');
    ty0=swipeHead?e.touches[0].clientY:0;
    cy0=ty0;
  },{passive:true});
  card.addEventListener('touchmove',e=>{
    if(!swipeHead)return;
    cy0=e.touches[0].clientY;
    const dy=Math.max(0,cy0-ty0);
    if(dy>0){card.style.transition='none';card.style.transform=`translateY(${dy*.4}px) scale(${1-dy*.0006})`;bd.style.opacity=String(Math.max(0,1-dy/220));}
  },{passive:true});
  card.addEventListener('touchend',()=>{
    if(!swipeHead){ty0=0;cy0=0;return;}
    card.style.transform=''; bd.style.opacity='';
    if(cy0-ty0>75)setU({modal:null}); else{card.style.transition='';card.classList.add('animating');}
    ty0=0;cy0=0;swipeHead=false;
  });

  card._origin=o;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bd.classList.add('open');
    card.classList.add('animating');
    card.style.top=`${ty}px`; card.style.left=`${tx}px`;
    card.style.width=`${tw}px`; card.style.height=`${th}px`;
    card.style.borderRadius='20px';
    card.style.boxShadow='0 24px 64px rgba(0,0,0,.22)';
  }));
}

function _closeHero(cb){
  const card=document.getElementById('_heroCard');
  const bd=document.getElementById('_heroBackdrop');
  if(!card)return;
  const o=card._origin||{top:window.innerHeight,left:0,width:0,height:0};
  card.classList.remove('animating'); card.classList.add('closing');
  card.style.top=`${o.top}px`; card.style.left=`${o.left}px`;
  card.style.width=`${o.width}px`; card.style.height=`${o.height}px`;
  card.style.borderRadius='10px'; card.style.boxShadow='none';
  bd?.classList.remove('open');
  setTimeout(()=>{card.remove();bd?.remove();if(cb)cb();},360);
}

function _mountSheet(content, m){
  const lock=m.t==='tripGate';
  const bd=document.createElement('div');
  bd.id='_sheetBackdrop'; bd.className='sheet-backdrop';
  if(!lock)bd.onclick=()=>setU({modal:null});
  document.body.appendChild(bd);

  const wrap=document.createElement('div');
  wrap.id='_sheetWrap'; wrap.className='sheet-wrap';
  wrap.innerHTML=`<div class="sheet-handle"></div>${content}`;
  document.body.appendChild(wrap);

  // Swipe down
  let sy=0,cy=0;
  wrap.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;},{passive:true});
  wrap.addEventListener('touchmove',e=>{
    cy=e.touches[0].clientY;
    const dy=Math.max(0,cy-sy);
    if(dy>0){wrap.style.transition='none';wrap.style.transform=`translateY(${dy}px)`;bd.style.opacity=String(Math.max(0,1-dy/180));}
  },{passive:true});
  wrap.addEventListener('touchend',()=>{
    wrap.style.transform=''; bd.style.opacity='';
    if(!lock&&cy-sy>60)setU({modal:null}); else{wrap.style.transition='';wrap.classList.add('open');}
    sy=0;cy=0;
  });

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bd.classList.add('open'); wrap.classList.add('open');
  }));
}

// Patch setU so modal changes always trigger overlay mount
const _origSetU=setU;
function setU(u){
  // ── Tab switch: always kill any open modal/overlay cleanly ──────────
  if(u.view!==undefined && u.view!==S.view){
    // Instantly remove overlays without animation (user navigated away)
    document.getElementById('_heroCard')?.remove();
    document.getElementById('_heroBackdrop')?.remove();
    document.getElementById('_sheetWrap')?.remove();
    document.getElementById('_sheetBackdrop')?.remove();
    document.getElementById('_wxSheet')?.remove();
    document.getElementById('_wxBackdrop')?.remove();
    S.quickOpen=false;
    S.wlFabOpen=false;
    S.sortMode=false;
    u={...u,modal:null}; // clear modal state on tab switch
  }

  const hadModal=!!S.modal;
  const hasModal=u.modal!==undefined?!!u.modal:hadModal;

  // ── Closing modal: animate close then apply state ────────────────────
  if(hadModal&&!hasModal){
    const heroCard=document.getElementById('_heroCard');
    const sheetWrap=document.getElementById('_sheetWrap');
    if(heroCard){
      const finalState={...S,...u};
      S={...S,modal:S.modal}; // keep modal during animation
      _closeHero(()=>{ S=finalState; render(); });
      return;
    }
    if(sheetWrap){
      sheetWrap.classList.remove('open');
      document.getElementById('_sheetBackdrop')?.classList.remove('open');
      sheetWrap.style.transition='';
      setTimeout(()=>{
        sheetWrap.remove();
        document.getElementById('_sheetBackdrop')?.remove();
      },360);
    }
  }

  S={...S,...u};
  render();
  // Only mount overlay if modal is newly set (not already mounted)
  if(S.modal && !document.getElementById('_heroCard') && !document.getElementById('_sheetWrap')){
    _mountModalOverlay();
  }
}

function switchTab(view){
  setU({view});
}


function toggleQuickMenu(btn){
  const willOpen=!S.quickOpen;
  // Store button rect BEFORE render (render re-draws the DOM)
  const rect=btn?btn.getBoundingClientRect():null;
  setU({quickOpen:willOpen});
  if(willOpen&&rect){
    // Two rAF: first lets render paint, second lets layout settle
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const menu=document.querySelector('.quick-menu');
      if(!menu)return;
      const mw=260;
      const vw=window.innerWidth;
      let left=rect.left;
      if(left+mw>vw-8) left=Math.max(8,vw-mw-8);
      menu.style.left=left+'px';
      menu.style.top=(rect.bottom+6)+'px';
      menu.style.opacity='1';
      menu.style.pointerEvents='auto';
    }));
  }
}

const MEMO_IMPORT_PROMPT=`請幫我列出 [目的地] 旅遊的行前備忘清單，包含證件、行李、預訂、其他事項，請嚴格按照以下格式輸出，不要加任何 Markdown、粗體、標題符號：

分類|項目

分類只能從以下選一個，完全照填：
證件、行李、預訂、其他

格式說明：
- 每行固定用「|」分成兩段：分類 | 項目
- 項目要具體實用，不要太籠統（例如「防曬乳 SPF50」比「防曬」好）
- 證件類包括護照、簽證、駕照、保險、機票等
- 行李類包括衣物、盥洗、藥品、3C 配件、雨具等
- 預訂類包括機票、飯店、租車、門票、餐廳訂位等
- 其他類包括手機網路、提款、緊急聯絡、行程確認等
- 不要加粗體 ** 不要加 # 不要加項目符號 - 不要加編號

範例輸出（以日本為例）：
證件|護照（6個月以上效期）
證件|機票電子檔
證件|海外旅平險
行李|薄外套（早晚溫差大）
行李|轉接頭（A型插座）
行李|常備藥品（感冒藥、腸胃藥）
預訂|機場接送
預訂|JR Pass 兌換券
預訂|餐廳訂位確認信
其他|海外漫遊或當地 SIM 卡
其他|提領少量日幣現金
其他|Google Maps 離線地圖`;

const MEMO_CAT_TEXT_MAP={'證件':'證件','行李':'行李','預訂':'預訂','預定':'預訂','其他':'其他'};

function _parseMemoImport(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l&&l.includes('|'));
  const items=[];
  for(const line of lines){
    const parts=line.split('|').map(p=>p.trim());
    if(parts.length<2)continue;
    const [catText,...rest]=parts;
    const txt=rest.join(' ').trim();
    if(!txt)continue;
    const cat=MEMO_CAT_TEXT_MAP[catText]||'其他';
    items.push({id:uid(),text:txt,cat,done:false});
  }
  return items;
}

// Trip-scoped durable journal: never mix data from two sync codes.
function addImportantInfo(el){

function travelToolkit(day){
  const cached=readTripCache();
  const keyItems=day.locations.filter(l=>l.important!==false&&(l.important===true||l.phone||l.reservation==='pending'||l.category==='住宿'||/航班|航空|取車|還車|集合/.test(l.name)));
  const points=day.locations.filter(l=>!(/航空|航班|JR|N.EX|大江戶線|山手線|中央線|地下鐵/.test(l.name)));

    const notes=l.notes||'';
    const firstLine=notes.split('\n')[0];

  }).join('');
  const segments=points.slice(1).map((to,i)=>{
    const from=points[i];
    const url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(from.address||from.name)+'&destination='+encodeURIComponent(to.address||to.name)+'&travelmode='+mode;
    return `<a class="travel-segment" href="${esc(url)}" target="_blank" rel="noopener">${i+1}. ${esc(from.name)} → ${esc(to.name)}</a>`;
  }).join('');
